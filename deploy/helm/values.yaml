replicaCount: 3

image:
  repository: ghcr.io/fruittreescanner
  pullPolicy: IfNotPresent

backend:
  image: backend
  workerImage: worker
  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: api.fruittreescanner.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: fruittreescanner-tls
        hosts:
          - api.fruittreescanner.example.com

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

worker:
  replicaCount: 2
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

externalSecrets:
  enabled: true
  databaseUrl: ""
  s3AccessKey: ""
  s3SecretKey: ""

postgresql:
  enabled: true
  auth:
    username: postgres
    password: postgres
    database: fruittreescanner
  primary:
    persistence:
      enabled: true
      size: 10Gi

redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 1Gi

minio:
  enabled: true
  auth:
    rootUser: minioadmin
    rootPassword: minioadmin
  persistence:
    enabled: true
    size: 50Gi
  buckets:
    - name: fruittreescanner
      policy: download
