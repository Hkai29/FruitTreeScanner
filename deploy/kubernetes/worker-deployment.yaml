apiVersion: apps/v1
kind: Deployment
metadata:
  name: fruittreescanner-worker
  namespace: fruittreescanner
  labels:
    app: fruittreescanner
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fruittreescanner
      component: worker
  template:
    metadata:
      labels:
        app: fruittreescanner
        component: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/fruittreescanner/worker:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fruittreescanner-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: S3_ENDPOINT
              value: "http://minio:9000"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fruittreescanner-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fruittreescanner-secrets
                  key: s3-secret-key
            - name: S3_BUCKET
              value: "fruittreescanner"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
