apiVersion: apps/v1
kind: Deployment
metadata:
  name: fruittreescanner-backend
  namespace: fruittreescanner
  labels:
    app: fruittreescanner
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fruittreescanner
      component: backend
  template:
    metadata:
      labels:
        app: fruittreescanner
        component: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/fruittreescanner/backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fruittreescanner-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: S3_ENDPOINT
              value: "http://minio:9000"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fruittreescanner-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fruittreescanner-secrets
                  key: s3-secret-key
            - name: S3_BUCKET
              value: "fruittreescanner"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fruittreescanner-backend
  namespace: fruittreescanner
spec:
  selector:
    app: fruittreescanner
    component: backend
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fruittreescanner-backend
  namespace: fruittreescanner
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api.fruittreescanner.example.com
      secretName: fruittreescanner-tls
  rules:
    - host: api.fruittreescanner.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fruittreescanner-backend
                port:
                  number: 80
