# Security Headers for FruitTreeScanner API
# Add to nginx configuration or use in application middleware

# Prevent XSS attacks
add_header X-XSS-Protection "1; mode=block" always;

# Prevent clickjacking
add_header X-Frame-Options "DENY" always;

# Strict Transport Security
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content Type Options
add_header X-Content-Type-Options "nosniff" always;

# Referrer Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions Policy
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Content Security Policy
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self';" always;
