name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen 2>&1 | tail -3

      - name: Show directory structure
        run: |
          echo "=== 仓库根目录 ==="
          ls -la
          echo "=== Swift 文件 ==="
          find . -name "*.swift" | head -20

      - name: Generate Xcode project
        run: |
          xcodegen generate 2>&1
          echo "=== xcodeproj 生成结果 ==="
          ls -la *.xcodeproj 2>/dev/null && echo "✅ 成功" || echo "❌ 失败"

      - name: Show project structure
        if: success()
        run: |
          echo "=== Generated pbxproj files ==="
          find . -name "*.pbxproj" | head -5
          echo "=== project.pbxproj 内容概览 ==="
          wc -l *.xcodeproj/*/project.pbxproj 2>/dev/null

      - name: Build (capture full output)
        run: |
          set -o pipefail
          xcodebuild \
            -project FruitTreeScanner.xcodeproj \
            -scheme FruitTreeScanner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee /tmp/build_full.log | grep -E "error:|warning:|BUILD|✗|✖|❌|✅|CompileSwift|Linking|Ld |" | tail -80
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "=== BUILD FULL LOG TAIL ==="
          tail -30 /tmp/build_full.log
          echo "=== EXIT CODE: $BUILD_EXIT ==="

      - name: Package IPA
        if: success()
        run: |
          APP=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          echo "APP路径: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r FruitTreeScanner.ipa Payload/
          ls -lh FruitTreeScanner.ipa

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FruitTreeScanner-IPA
          path: FruitTreeScanner.ipa
          retention-days: 7
