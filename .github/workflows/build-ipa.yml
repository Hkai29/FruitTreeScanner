name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project (clean)
        run: |
          rm -rf FruitTreeScanner.xcodeproj
          xcodegen generate --spec project.yml
          ls -la *.xcodeproj 2>/dev/null && echo "✅ xcodeproj 生成" || echo "❌ 失败"

      - name: Build
        id: build
        run: |
          xcodebuild \
            -project FruitTreeScanner.xcodeproj \
            -scheme FruitTreeScanner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee /tmp/build_output.txt
          EXIT=${PIPESTATUS[0]}
          echo "EXIT_CODE=$EXIT" >> $GITHUB_ENV

          # 提取错误（写 step summary）
          echo "### xcodebuild errors" >> $GITHUB_STEP_SUMMARY
          grep -E "error:" /tmp/build_output.txt | head -20 >> $GITHUB_STEP_SUMMARY || echo "无错误" >> $GITHUB_STEP_SUMMARY
          echo "EXIT CODE: $EXIT" >> $GITHUB_STEP_SUMMARY

          # 提取警告
          echo "### xcodebuild warnings (first 5)" >> $GITHUB_STEP_SUMMARY
          grep -E "warning:" /tmp/build_output.txt | head -5 >> $GITHUB_STEP_SUMMARY || true

          APP=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          echo "APP_PATH=$APP" >> $GITHUB_ENV

          if [ -n "$APP" ] && [ $EXIT -eq 0 ]; then
            mkdir -p Payload
            cp -r "$APP" Payload/
            zip -r FruitTreeScanner.ipa Payload/
            echo "IPA_CREATED=true" >> $GITHUB_ENV
          fi

          exit $EXIT

      - name: Package IPA
        if: env.IPA_CREATED == 'true'
        run: ls -lh FruitTreeScanner.ipa

      - name: Upload IPA artifact
        if: env.IPA_CREATED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FruitTreeScanner-IPA
          path: FruitTreeScanner.ipa
          retention-days: 7
