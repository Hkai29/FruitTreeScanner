name: iOS Build

on:
  push:
    branches: [ main ]
    paths:
      - 'FruitTreeScanner/**'
      - 'FruitTreeScannerTests/**'
      - 'FruitTreeScanner.xcodeproj/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build for iOS Simulator
        id: build
        run: |
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -5

          xcodebuild \
            -project FruitTreeScanner.xcodeproj \
            -scheme FruitTreeScanner \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/build_output.txt
          EXIT=${PIPESTATUS[0]}
          echo "EXIT_CODE=$EXIT" >> $GITHUB_ENV

          echo "### xcodebuild errors" >> $GITHUB_STEP_SUMMARY
          grep -E "error:" /tmp/build_output.txt | head -30 >> $GITHUB_STEP_SUMMARY || echo "✅ 无编译错误" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "EXIT CODE: $EXIT" >> $GITHUB_STEP_SUMMARY
          echo "This workflow verifies simulator compilation. IPA packaging still requires device signing outside CI." >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Warnings (first 10)" >> $GITHUB_STEP_SUMMARY
          grep -E "warning:" /tmp/build_output.txt | grep -v "accessibility" | head -10 >> $GITHUB_STEP_SUMMARY || true

          APP=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          echo "APP_PATH=$APP" >> $GITHUB_ENV
          if [ -n "$APP" ]; then echo "APP_FOUND=true" >> $GITHUB_ENV; fi

          exit $EXIT
