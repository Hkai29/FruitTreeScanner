name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la *.xcodeproj 2>/dev/null || echo "xcodeproj 未生成"

      - name: Build
        run: |
          xcodebuild \
            -project FruitTreeScanner.xcodeproj \
            -scheme FruitTreeScanner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build > /tmp/build.log 2>&1
          BUILD_EXIT=$?

          echo "=== BUILD EXIT CODE: $BUILD_EXIT ==="
          grep -E "error:|warning:|BUILD" /tmp/build.log | tail -30

          APP=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          echo "APP路径: $APP"

          if [ -n "$APP" ]; then
            mkdir -p Payload
            cp -r "$APP" Payload/
            zip -r FruitTreeScanner.ipa Payload/
            echo "✅ IPA 打包成功"
          fi

          gzip -c /tmp/build.log > build.log.gz

          if [ $BUILD_EXIT -eq 0 ] && [ -f FruitTreeScanner.ipa ]; then
            echo "✅ BUILD 成功"
          else
            echo "❌ BUILD 失败 (exit $BUILD_EXIT)"
          fi
          exit $BUILD_EXIT

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FruitTreeScanner-IPA
          path: FruitTreeScanner.ipa
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log.gz
          retention-days: 3
