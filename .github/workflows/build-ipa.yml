name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la *.xcodeproj 2>/dev/null || echo "xcodeproj 未生成"

      - name: Build
        id: build
        run: |
          echo "### xcodebuild output" >> $GITHUB_STEP_SUMMARY
          xcodebuild \
            -project FruitTreeScanner.xcodeproj \
            -scheme FruitTreeScanner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee build_output.txt
          EXIT=${PIPESTATUS[0]}
          echo "EXIT_CODE=$EXIT" >> $GITHUB_ENV
          echo "Build exit code: $EXIT" >> $GITHUB_STEP_SUMMARY

          # 提取错误
          grep -E "^.*error:.*$" build_output.txt | head -10 >> $GITHUB_STEP_SUMMARY || true

          APP=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          echo "APP_PATH=$APP" >> $GITHUB_ENV

          if [ -n "$APP" ] && [ $EXIT -eq 0 ]; then
            mkdir -p Payload
            cp -r "$APP" Payload/
            zip -r FruitTreeScanner.ipa Payload/
            echo "IPA_CREATED=true" >> $GITHUB_ENV
          fi

          exit $EXIT

      - name: Package IPA
        if: env.IPA_CREATED == 'true'
        run: |
          ls -lh FruitTreeScanner.ipa

      - name: Upload IPA artifact
        if: env.IPA_CREATED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FruitTreeScanner-IPA
          path: FruitTreeScanner.ipa
          retention-days: 7
