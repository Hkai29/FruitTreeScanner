name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project (clean)
        run: |
          rm -rf FruitTreeScanner.xcodeproj
          xcodegen generate --spec project.yml
          ls -la *.xcodeproj 2>/dev/null && echo "✅ xcodeproj 生成" || echo "❌ 失败"

      - name: Build
        id: build
        run: |
          # 先列出可用的 simulators
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -5
          
          xcodebuild \
            -project FruitTreeScanner.xcodeproj \
            -scheme FruitTreeScanner \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/build_output.txt
          EXIT=${PIPESTATUS[0]}
          echo "EXIT_CODE=$EXIT" >> $GITHUB_ENV

          # 提取错误（写 step summary）
          echo "### xcodebuild errors (Simulator build - IPA not created)" >> $GITHUB_STEP_SUMMARY
          grep -E "error:" /tmp/build_output.txt | head -30 >> $GITHUB_STEP_SUMMARY || echo "✅ 无编译错误" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "EXIT CODE: $EXIT" >> $GITHUB_STEP_SUMMARY
          echo "(IPA packaging requires device + code signing - this build tests compilation only)" >> $GITHUB_STEP_SUMMARY

          # 警告摘要
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Warnings (first 10)" >> $GITHUB_STEP_SUMMARY
          grep -E "warning:" /tmp/build_output.txt | grep -v "accessibility" | head -10 >> $GITHUB_STEP_SUMMARY || true

          APP=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          echo "APP_PATH=$APP" >> $GITHUB_ENV
          if [ -n "$APP" ]; then echo "APP_FOUND=true" >> $GITHUB_ENV; fi

          exit $EXIT

      - name: Package as IPA
        if: env.APP_FOUND == 'true'
        run: |
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          echo "Packaging: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r FruitTreeScanner.ipa Payload
          echo "IPA created: $(ls -lh FruitTreeScanner.ipa)"

      - name: Upload IPA
        if: env.APP_FOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FruitTreeScanner-IPA
          path: FruitTreeScanner.ipa
          retention-days: 7
