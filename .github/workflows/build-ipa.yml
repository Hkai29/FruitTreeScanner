name: iOS Build

on:
  push:
    branches: [ main ]
    paths:
      - 'FruitTreeScanner/**'
      - 'FruitTreeScannerTests/**'
      - 'FruitTreeScannerUITests/**'
      - 'FruitTreeScanner.xcodeproj/**'
      - '.github/workflows/build-ipa.yml'
      - 'tools/validate_fusion_domain.sh'
      - 'tools/ci_simulator_build.sh'
      - 'tools/ci_xctest_gate.sh'
      - 'tools/ci_evidence.py'
      - 'tools/ci_result_reader.py'
      - 'tools/ci_ui_host_setup.py'
      - 'tools/ci_verify_xctest_artifact.py'
      - 'tools/xctest_gate.py'
      - 'tools/check_test_target_registration.py'
      - 'tools/check_ci_test_registration_gate.py'
      - 'tools/tests/**'
      - 'tools/code_improvement_workflow.py'
  pull_request:
    branches: [ main ]
    paths:
      - 'FruitTreeScanner/**'
      - 'FruitTreeScannerTests/**'
      - 'FruitTreeScannerUITests/**'
      - 'FruitTreeScanner.xcodeproj/**'
      - '.github/workflows/build-ipa.yml'
      - 'tools/validate_fusion_domain.sh'
      - 'tools/ci_simulator_build.sh'
      - 'tools/ci_xctest_gate.sh'
      - 'tools/ci_evidence.py'
      - 'tools/ci_result_reader.py'
      - 'tools/ci_ui_host_setup.py'
      - 'tools/ci_verify_xctest_artifact.py'
      - 'tools/xctest_gate.py'
      - 'tools/check_test_target_registration.py'
      - 'tools/check_ci_test_registration_gate.py'
      - 'tools/tests/**'
      - 'tools/code_improvement_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Execute compatibility XCTest
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Structural failures must fail fast: a UI test source that exists in the
      # repository but is never compiled into its target is invisible to the
      # XCTest gate (it does not run the UI test target at all), so it needs its
      # own early, hard-failing step. It needs no Xcode, so it runs before the
      # runner is configured and before anything is built.
      - name: UITest target registration gate
        shell: bash
        run: python3 tools/check_test_target_registration.py

      # Guards the wiring above: if the registration step is deleted, moved
      # behind the expensive build, or made non-blocking, this step fails.
      - name: CI registration gate wiring check
        shell: bash
        run: python3 tools/check_ci_test_registration_gate.py

      - name: Use runner Xcode
        shell: bash
        run: |
          task_xcode_directory="$(xcode-select -p)"
          printf 'DEVELOPER_DIR=%s\n' "$task_xcode_directory" >> "$GITHUB_ENV"
          printf 'FTS_CI_EVIDENCE_DIR=%s/FruitTreeScanner-ci-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Validate Domain dependencies
        shell: bash
        run: bash tools/validate_fusion_domain.sh

      - name: Build for iOS Simulator
        id: build
        shell: bash
        run: bash tools/ci_simulator_build.sh

      - name: XCTest gate
        shell: bash
        env:
          FTS_CI_XCTEST_MODE: handoff
          FTS_CI_XCTEST_CONSUMER: verify
        run: bash tools/ci_xctest_gate.sh

      - name: Retain CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/FruitTreeScanner-ci-evidence/
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          include-hidden-files: true

  verify:
    name: build
    needs: build
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download XCTest evidence
        uses: actions/download-artifact@v8
        with:
          name: ios-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/FruitTreeScanner-ci-input/
          digest-mismatch: error

      - name: Verify XCTest evidence
        shell: bash
        run: python3 tools/ci_verify_xctest_artifact.py --artifact-dir "${{ runner.temp }}/FruitTreeScanner-ci-input" --output-root "${{ runner.temp }}/FruitTreeScanner-ci-verification"

      - name: Retain XCTest verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/FruitTreeScanner-ci-verification/
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          include-hidden-files: true
