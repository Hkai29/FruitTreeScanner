name: FruitTreeScanner
options:
  bundleIdPrefix: com.hkai29
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  FruitTreeScanner:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: FruitTreeScanner
        excludes:
          - "**/*.md"
          - "project.yml"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hkai29.fruitscanner
        PRODUCT_NAME: FruitTreeScanner
        INFOPLIST_FILE: FruitTreeScanner/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        SWIFT_OBJC_BRIDGING_HEADER: FruitTreeScanner/Core/Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
